# The prototype star set (spec §11; NEU-1710): the stars whose Light Curves live in
# `lightcurves/` and whose published values the prototype gate (NEU-1711) checks.
#
# `scripts/build_fixtures.py` reads this file and rewrites it to fill in `coverage`, so
# explanations go in this header, which it keeps; other comments would be dropped.
#
# Fields (the M2 contract first):
#   star              VSX name; for a star not in VSX, "Gaia DR3 <source_id>"
#   gaia_source_id    Gaia DR3 source ID, the key of the fixture paths
#   published_period  days, as VSX publishes it; null when nothing is published
#   published_type    VSX type code; null when the star is not in VSX
#   source            where the period and type come from, and what confirms them
#   role              positive | negative
#   negative_kind     negatives only: blend | alias_trap | constant
#   vsx_oid           VSX OID, or null
#   ra, dec           Gaia DR3 position (ICRS, epoch J2016.0), degrees; what the fetchers query
#   gaia_g            Gaia DR3 phot_g_mean_mag
#   true_period       alias traps only: the period the published one is an alias of
#   blend_host        blends only: the variable whose light falls in the star's aperture
#   coverage          per survey, the bands written to lightcurves/: a list of bands; [] when
#                     the survey has no data for the star (a coverage gap); "pending" when
#                     the survey has not been fetched yet (ASAS-SN until NEU-1796)
#
# How the set was chosen, on 2026-10-20:
#   Positives are VSX entries in Draco (or, for the Cepheid, neighbouring Cepheus) with
#   maximum 13-16 mag and one Gaia DR3 source within 3", whose VSX period matches the
#   independent ZTF period of Chen et al. 2020 (2020ApJS..249...18C) within 0.1 %. Entries
#   whose VSX period is identical to the ZTF one were skipped: VSX imported those from the
#   same catalog, so the two do not confirm each other.
#   Alias traps are VSX entries whose period differs from both the ZTF and the Gaia DR3
#   period by 1 cycle per day (solar or sidereal), while those two agree. The VSX value is
#   the trap: the gate expects no Agreement at `published_period`, and the period the
#   pipeline should find is `true_period`.
#   Blends are VSX entries whose position falls on a Gaia DR3 source not flagged variable,
#   with a Gaia DR3 eclipsing binary under 1.5" away whose Gaia period matches the VSX one.
#   Ground surveys do not separate the two, so the variability VSX credits to the star is
#   the neighbour's; within 3" and brighter than G + 2, the neighbour makes the blend check
#   flag `blend_suspect`. `gaia_source_id` is the non-variable source; `blend_host` the
#   eclipsing binary.
#   Constants are Gaia DR3 sources near (262, +60) with no VSX entry within 30", not
#   flagged variable, RUWE < 1.2, and among the lowest G-band flux scatter
#   (phot_g_mean_flux_error * sqrt(phot_g_n_obs) / phot_g_mean_flux) at their magnitude.

