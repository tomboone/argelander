# Service definitions shared by every environment. compose.dev.yaml layers the dev stack on
# top (`task up`); the prod services, USB mounts and memory limits arrive with NEU-1723.
name: argelander

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: argelander
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argelander}
      POSTGRES_DB: argelander
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argelander -d argelander"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      target: prod
    image: argelander:latest
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://argelander:${POSTGRES_PASSWORD:-argelander}@postgres:5432/argelander}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
