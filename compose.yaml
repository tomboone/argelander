# The prod stack on the Mac mini (spec §10); compose.dev.yaml layers the dev stack on top
# (`task up`). No credentials here (spec §12): POSTGRES_PASSWORD, USB_ROOT, TS_AUTHKEY and the
# backup's restic and B2 settings come from the mini's .env. The first two have defaults that
# fail loudly rather than being required with `:?`, which Compose checks per file before merging, so it would refuse the dev
# stack too: an empty password stops Postgres initialising, and the placeholder USB_ROOT names
# itself in the "bind source path does not exist" error. TS_AUTHKEY is blank after the first
# start by design.
#
# The host is a 2011 Mac mini with 16 GB shared with Navidrome and Uptime Kuma, so every
# service has a memory limit. Postgres stays on the internal SSD; the Cache, the plots and
# the astropy download cache live on the USB SSD mounted at USB_ROOT.
name: argelander

# Rotated, so a chatty worker cannot fill the 256 GB boot disk. The services log JSON lines.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

# XDG_CACHE_HOME has to follow ASTRO_CACHE_DIR (see the Dockerfile).
x-environment: &environment
  DATABASE_URL: &database-url postgresql+psycopg://argelander:${POSTGRES_PASSWORD:-}@postgres:5432/argelander
  CACHE_DIR: /usb/cache
  PLOTS_DIR: /usb/plots
  ASTRO_CACHE_DIR: /usb/astropy
  XDG_CACHE_HOME: /usb/astropy

# The workers get the SSD's mount point itself, not its subdirectories: with the SSD
# unplugged, the mount point is an empty directory on the boot disk, so the workers still
# start and their mount guard names the problem in their logs (no Cache marker), rather than
# Docker refusing to create the container. create_host_path stops Docker making an empty
# USB_ROOT on the boot disk when the path is wrong.
x-usb: &usb
  type: bind
  source: ${USB_ROOT:-/USB_ROOT-is-not-set}
  target: /usb
  bind:
    create_host_path: false

# One image, one package (spec §3): each service is the prod image with its own command. The
# image is pulled from GHCR, published by .github/workflows/image.yml on every push to main;
# compose.dev.yaml builds it locally instead. IMAGE_TAG pins a `sha-<7>` tag to roll back
# (deploy/README.md).
x-app: &app
  image: ghcr.io/tomboone/argelander:${IMAGE_TAG:-latest}
  init: true
  restart: unless-stopped
  environment: *environment
  logging: *logging
  depends_on:
    postgres:
      condition: service_healthy
  labels: &watchtower-labels
    - com.centurylinklabs.watchtower.enable=true
    - com.centurylinklabs.watchtower.scope=argelander

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_USER: argelander
      POSTGRES_DB: argelander
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argelander -d argelander"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The workers have no port to probe; healthy means the Cache marker is still readable, which
  # turns unhealthy if the SSD drops out under a running worker.
  fetcher:
    <<: *app
    command: ["argelander", "fetch-worker"]
    mem_limit: 1g
    volumes:
      - *usb
    healthcheck:
      test: ["CMD-SHELL", "test -f \"$$CACHE_DIR/.argelander-cache\""]
      interval: 1m
      timeout: 5s

  analyzer:
    <<: *app
    command: ["argelander", "analyze-worker"]
    mem_limit: 3g
    volumes:
      - *usb
    healthcheck:
      test: ["CMD-SHELL", "test -f \"$$CACHE_DIR/.argelander-cache\""]
      interval: 1m
      timeout: 5s

  # Nightly pg_dump into a restic repository on Backblaze B2, at 03:30 local (deploy/restore.md).
  # Only Postgres is backed up: the Cache can be downloaded again and the plots redrawn. Its
  # own image, not the app's, published and pinned alongside it. The repository and its
  # credentials come from the mini's .env; without them the service refuses to start and says
  # which are missing. pg_dump takes a libpq URL, so DATABASE_URL here has no `+psycopg`
  # driver suffix, and no password: in the URL it would sit in pg_dump's arguments, which `ps`
  # on the host shows. libpq reads PGPASSWORD instead.
  backup:
    image: ghcr.io/tomboone/argelander-backup:${IMAGE_TAG:-latest}
    init: true
    restart: unless-stopped
    mem_limit: 512m
    environment:
      TZ: America/New_York
      DATABASE_URL: postgresql://argelander@postgres:5432/argelander
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - restic-cache:/var/cache/restic
    logging: *logging
    labels: *watchtower-labels
    depends_on:
      postgres:
        condition: service_healthy

  # The api's own node, `argelander`, on the personal tailnet, tagged tag:app; the host's own
  # tailnet node is kumadrome (deploy/tailscale.md). Serve terminates HTTPS on 443 at
  # https://argelander.tail1afe5a.ts.net and proxies to http://api:8000 over the Compose network
  # (deploy/tailscale/serve.json), the same pattern as kumadrome's other apps. Userspace
  # networking, so it needs no NET_ADMIN or /dev/net/tun.
  tailscale:
    image: tailscale/tailscale:stable
    # Never the name of a service it proxies: Docker maps a container's own hostname to itself in
    # /etc/hosts, so a proxy to that name would dial the sidecar (Navidrome's 502). The tailnet
    # name is TS_HOSTNAME.
    hostname: argelander-tailscale
    restart: unless-stopped
    mem_limit: 128m
    environment:
      TS_HOSTNAME: argelander
      # One-time auth key from the personal tailnet, tagged tag:app. Blank it once the state
      # volume holds the node key.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:---advertise-tags=tag:app}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      # The directory, not the file: containerboot watches it, so a git pull that replaces
      # serve.json still reaches the running sidecar.
      - ./deploy/tailscale:/config:ro
      - tailscale-state:/var/lib/tailscale
    logging: *logging

  # The review app reads Postgres and serves the plots, read-only. It is on the Compose network
  # and publishes nothing on the host: the tailscale sidecar is the one way in, at
  # https://argelander.tail1afe5a.ts.net, where Uptime Kuma watches its /healthz (NEU-1727). It
  # mounts only the plots, so the astropy cache stays at the image's writable default.
  # It migrates before serving, so a Watchtower update that brings a migration applies it. Only
  # the api migrates, so two containers never race on the same upgrade; the workers wait for
  # the schema head instead (docs/runbook.md §10).
  api:
    <<: *app
    command: ["sh", "-c", "argelander db-upgrade && exec argelander web"]
    mem_limit: 512m
    environment:
      DATABASE_URL: *database-url
      PLOTS_DIR: /usb/plots
    volumes:
      - type: bind
        source: ${USB_ROOT:-/USB_ROOT-is-not-set}/plots
        target: /usb/plots
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"
      interval: 1m
      timeout: 10s

  # Polls GHCR every 5 minutes and recreates only enabled containers in the `argelander` scope
  # (the api, the workers and the backup) on a new image, removing the old one. It leaves
  # postgres and the tailscale sidecar alone, and the other stacks' containers on the mini, and
  # their own Watchtowers. The instance carries its own scope label, as Watchtower's
  # multiple-instance docs require.
  watchtower:
    image: containrrr/watchtower:1.7.1
    command: ["--label-enable", "--scope", "argelander", "--interval", "300", "--cleanup"]
    restart: unless-stopped
    mem_limit: 128m
    environment:
      # Watchtower's client defaults to API 1.25, which Docker Engine 29+ rejects.
      DOCKER_API_VERSION: "1.44"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging: *logging
    healthcheck:
      test: ["CMD", "/watchtower", "--health-check"]
      interval: 1m
      timeout: 10s
    labels:
      - com.centurylinklabs.watchtower.scope=argelander

volumes:
  postgres-data:
  # The node key. Losing it means registering the node again (deploy/tailscale.md).
  tailscale-state:
  # restic's local copy of the repository index; disposable, rebuilt from B2 when missing.
  restic-cache:
