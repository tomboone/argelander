name: ci

# Calls the shared workflows in neuroticsasquat-ch/workflows (ops spec "Shared CI workflows";
# this repo's spec §11). Runs on a GitHub-hosted runner straight from uv, not inside the built
# image. Tests marked `live` hit the archives and never run here; tests marked `gate` (the
# prototype gate) run in the `gate` job, because they take minutes. pyproject's `addopts`
# deselects both, so the shared workflow's bare `pytest` runs the offline tests.

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a PR cancels its older run. Each push to main gets a group of its own, so a
# second merge inside the gate's run cannot drop the first one's run (GitHub keeps only one
# pending run per group).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # uv sync, ruff check, ruff format --check, ty check, the Alembic head and drift checks,
  # pytest. Scope, markers and options live in pyproject.toml; DATABASE_URL comes from
  # .github/ci/env. tests/test_db.py migrates a throwaway database beside it.
  python:
    uses: neuroticsasquat-ch/workflows/.github/workflows/python.yml@v1
    with:
      postgres: "16"
      typechecker: ty

  # Builds each image without pushing and checks it doesn't run as root. The backup image is
  # built here so its first build is never on the mini at deploy time (deploy/restore.md).
  image:
    strategy:
      # One image failing must not cancel the other's build.
      fail-fast: false
      # The app's target is named, rather than relying on `prod` being the last stage. The
      # backup Dockerfile has one stage.
      matrix:
        include:
          - name: argelander
            context: .
            target: prod
          - name: argelander-backup
            context: deploy/backup
            target: ""
    uses: neuroticsasquat-ch/workflows/.github/workflows/image-check.yml@v1
    with:
      name: ${{ matrix.name }}
      context: ${{ matrix.context }}
      target: ${{ matrix.target }}

  gate:
    # The prototype gate (spec §11): every fixture star through the pipeline. On a PR it runs
    # only when something it could catch has changed. The job itself always runs and reports,
    # so a docs-only PR still gets a green `gate` (NEU-1838), and `ci` never sees it skipped.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so the PR's merge base with its target is present.
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether the science can have changed
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "A $EVENT event always runs the gate."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # What the gate's result can depend on: the package, the fixtures, the gate test
          # and its conftest, and the dependencies.
          paths=(src tests/fixtures tests/test_prototype.py tests/conftest.py pyproject.toml uv.lock)
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD" -- "${paths[@]}")
          if [ -n "$changed" ]; then
            echo "Running the gate; this PR changes:"
            echo "$changed"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping the gate: this PR changes none of: ${paths[*]}"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.scope.outputs.run == 'true'
        # uv reads the interpreter from .python-version. setup-uv publishes no floating major
        # tags from v8 on, so pin the full release.
        uses: astral-sh/setup-uv@v10.3.3

      - name: Sync dependencies
        if: steps.scope.outputs.run == 'true'
        run: uv sync --locked

      - name: Prototype gate
        if: steps.scope.outputs.run == 'true'
        # `-m gate` replaces addopts' `-m "not live and not gate"`. -v names each star's case
        # in the log.
        run: uv run pytest -m gate -v

  ci: # the one required check; the name is the contract
    if: always()
    needs: [python, image, gate] # every other job, extras included
    runs-on: ubuntu-latest
    steps:
      - uses: neuroticsasquat-ch/workflows/actions/gate@v1
        with:
          needs: ${{ toJSON(needs) }}

  # main → latest and sha-<7> for each image, only after ci passed on that commit. Watchtower
  # on the mini deploys latest.
  publish:
    if: ${{ !cancelled() && github.event_name == 'push' && needs.ci.result == 'success' }}
    needs: ci
    strategy:
      # One image failing must not cancel the other's publish mid-push.
      fail-fast: false
      matrix:
        include:
          - name: argelander
            context: .
            target: prod
          - name: argelander-backup
            context: deploy/backup
            target: ""
    # The image is part of the group, so the two images don't queue behind each other, and a
    # third run can't replace the other image's pending one.
    concurrency: { group: "publish-${{ github.ref }}-${{ matrix.name }}", cancel-in-progress: false }
    permissions: { contents: read, packages: write }
    uses: neuroticsasquat-ch/workflows/.github/workflows/image-publish.yml@v1
    with:
      image: ghcr.io/tomboone/${{ matrix.name }}
      name: ${{ matrix.name }}
      context: ${{ matrix.context }}
      target: ${{ matrix.target }}
