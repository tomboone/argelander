name: image

# Publishes the app and backup images to GHCR on every push to main, for Watchtower on the mini
# to pull. Copied from closinglineup's image.yml, with a matrix entry per image.

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

# Publishes run one at a time, in push order, so `latest` never regresses to an older commit. A running
# publish is never cancelled, so its `sha-` tag always lands.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      # One image failing must not cancel the other's publish mid-push.
      fail-fast: false
      # The app's target is named, rather than relying on `prod` being the last stage. The
      # backup Dockerfile has one stage, so no target.
      matrix:
        include:
          - image: argelander
            context: .
            target: prod
          - image: argelander-backup
            context: deploy/backup
            target: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main → latest and sha-<7>; there is no edge tag.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/tomboone/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      # A cache scope per image, so neither build evicts the other's layers.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
