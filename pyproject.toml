[project]
name = "argelander"
version = "0.1.0"
description = "Proposes evidence-backed corrections to the AAVSO VSX variable star catalog"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "astropy>=8.0.2",
    "astroquery>=0.4.11",
    "lightkurve>=2.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.6",
    "requests>=2.32",
    "sqlalchemy[asyncio]>=2.1.5",
    "typer>=0.15",
]

[project.scripts]
argelander = "argelander.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyyaml>=6.0.3",
    "ruff>=0.8",
    "ty>=0.0.89",
]
# Installed only in the `jupyter` image stage (Dockerfile), never in CI or prod.
notebook = [
    "jupyterlab>=4.4",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# ruff formats Python fences inside Markdown; the spec's illustrative snippets are prose.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade: enforces `X | None` over Optional (UP007, UP045)
    "B",   # bugbear
    "TID", # tidy imports: bans `from __future__ import annotations` below
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations" = { msg = "Do not use `from __future__ import annotations`; write real `X | None` hints." }

[tool.ty.src]
include = ["src", "tests", "scripts"]

# ty is pre-1.0. Allow unresolved imports per module for the thinly typed astronomy
# libraries (astropy, astroquery, lightkurve) as they arrive, never globally (spec §3.2):
#
# [tool.ty.analysis]
# allowed-unresolved-imports = ["astropy.**"]

[tool.alembic]
# The `alembic` command line (autogenerate, check, heads) from the repo root. The migrations
# ship inside the package; `argelander db-upgrade` sets the same location in code
# (argelander.db.migrations), so the prod image needs no Alembic config file.
script_location = "argelander:alembic"

[[tool.alembic.post_write_hooks]]
# Autogenerated revisions come out formatted and import-sorted, as the hooks would leave them.
# Format first: the lint pass would otherwise report every long line autogenerate writes.
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "live: hits external archives (ZTF, MAST, Gaia, ASAS-SN); skipped in CI with -m 'not live'",
    "gate: runs every fixture star through the pipeline (the prototype gate); its own CI job",
]
