version: "3"

# Docker-only local dev: every tool runs in the `app` container, as the pre-commit hooks do.
# The exception is `deploy`, which runs on the mini against compose.yaml alone (deploy/README.md).
# `backup:check` arrives with the backup ticket (NEU-1726).
dotenv: [".env"]

vars:
  COMPOSE: docker compose -f compose.yaml -f compose.dev.yaml
  EXEC: docker compose exec -T app
  PROD_COMPOSE: docker compose -f compose.yaml

tasks:
  up:
    desc: Build and start the dev stack (postgres, app, jupyter), then install the git hooks
    cmds:
      - "{{.COMPOSE}} up --detach --build --wait"
      - task: hooks
      - 'echo "JupyterLab: http://localhost:${JUPYTER_PORT:-8888}/lab"'

  down:
    desc: Stop the dev stack and its workers (the postgres volume is kept)
    cmd: "{{.COMPOSE}} --profile workers down"

  workers:
    desc: Start (or restart) the fetch and analyze workers on the dev stack
    cmd: "{{.COMPOSE}} --profile workers up --detach --force-recreate fetcher analyzer"

  workers:logs:
    desc: Follow the fetch and analyze workers' JSON logs
    cmd: "{{.COMPOSE}} logs --follow --tail 50 fetcher analyzer"

  workers:stop:
    desc: Stop the fetch and analyze workers, leaving the rest of the dev stack up
    cmd: "{{.COMPOSE}} --profile workers stop fetcher analyzer"

  shell:
    desc: Open a shell in the app container
    cmd: "{{.COMPOSE}} exec app bash"

  hooks:
    desc: Install the pre-commit and pre-push hooks (the framework is the host's pre-commit)
    preconditions:
      - sh: command -v pre-commit
        msg: "pre-commit is not installed on the host: brew install pre-commit"
    cmd: pre-commit install --hook-type pre-commit --hook-type pre-push

  test:
    desc: "Run the offline tests (usage: task test -- [pytest args])"
    cmd: '{{.EXEC}} pytest -m "not live" {{.CLI_ARGS}}'

  lint:
    desc: Lint and check formatting, as CI does
    cmds:
      - "{{.EXEC}} ruff check"
      - "{{.EXEC}} ruff format --check"

  format:
    desc: Apply ruff's lint fixes and formatting
    cmds:
      - "{{.EXEC}} ruff check --fix"
      - "{{.EXEC}} ruff format"

  typecheck:
    desc: Typecheck with ty
    cmd: "{{.EXEC}} ty check"

  migrate:
    desc: Apply database migrations to the dev database
    cmd: "{{.EXEC}} argelander db-upgrade"

  deploy:
    desc: "On the mini: pull main, rebuild, migrate and bring the prod stack up (deploy/README.md)"
    preconditions:
      - sh: test -n "$USB_ROOT"
        msg: "USB_ROOT is not set: task deploy runs on the mini, with its .env; elsewhere, task deploy:remote"
      - sh: test -n "$POSTGRES_PASSWORD"
        msg: "POSTGRES_PASSWORD is not set in .env (deploy/README.md)"
      - sh: test "$(git branch --show-current)" = main
        msg: "the checkout is not on main; deploys come from main only"
    cmds:
      - git pull --ff-only
      - "{{.PROD_COMPOSE}} pull --ignore-buildable"
      - "{{.PROD_COMPOSE}} build --pull"
      - "{{.PROD_COMPOSE}} run --rm fetcher argelander db-upgrade"
      - "{{.PROD_COMPOSE}} up -d --remove-orphans"
      - "{{.PROD_COMPOSE}} ps"

  deploy:remote:
    desc: Run task deploy on the mini over SSH
    cmd: ssh kumadrome 'cd ~/argelander && task deploy'
