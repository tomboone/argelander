<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Argelander{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  {# htmx halts a request on a form that fails validation; this says why rather than nothing. #}
  <meta name="htmx-config" content='{"reportValidityOfForms": true}'>
  <script src="{{ url_for('static', path='htmx.min.js') }}" defer></script>
</head>
<body>
  <header>
    <a class="brand" href="/">Argelander</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
